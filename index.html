<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real time counter</title>
  <link rel ="stylesheet" href ="style.css">

</head>
<body>
  <div class ="container"><h2>
    Real time character Counter
  </h2>
<textarea class="text" id="textarea" placeholder="please write your text here...."maxlength="50"></textarea>
<div class ="conter-container">
  <p> Total Character:<span class="total-container" id ="total-counter">30</span></p>
  <p> Remaining:
    <span class="remaining-container" id ="remaining-counter">20</span>
  </p>
</div>
  
</body>
</html>
